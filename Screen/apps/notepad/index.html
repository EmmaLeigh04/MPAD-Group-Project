<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Untitled - Notepad2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="np2-window">
    <!-- Title bar removed for authentic Notepad2 look -->
    <div class="np2-menu">
      <span class="np2-menu-item">File</span>
      <span class="np2-menu-item">Edit</span>
      <span class="np2-menu-item">View</span>
      <span class="np2-menu-item">Settings</span>
      <span class="np2-menu-item">?</span>
    </div>
    <div class="np2-toolbar">
      <span class="np2-toolbar-btn" title="New"></span>
      <span class="np2-toolbar-btn" title="Open"></span>
      <span class="np2-toolbar-btn" title="Save"></span>
      <span class="np2-toolbar-sep"></span>
      <span class="np2-toolbar-btn" title="Cut"></span>
      <span class="np2-toolbar-btn" title="Copy"></span>
      <span class="np2-toolbar-btn" title="Paste"></span>
      <span class="np2-toolbar-sep"></span>
      <span class="np2-toolbar-btn" title="Undo"></span>
      <span class="np2-toolbar-btn" title="Redo"></span>
      <span class="np2-toolbar-sep"></span>
      <span class="np2-toolbar-btn" title="Find"></span>
      <span class="np2-toolbar-btn" title="Replace"></span>
      <span class="np2-toolbar-btn" title="Go To"></span>
      <span class="np2-toolbar-sep"></span>
      <span class="np2-toolbar-btn" title="Zoom In"></span>
      <span class="np2-toolbar-btn" title="Zoom Out"></span>
    </div>
    <textarea class="np2-editor" spellcheck="false"></textarea>
    <div class="np2-statusbar">
      Ln 1 : 1   Col 1   Sel 0   0 Bytes   ANSI   CR+LF   INS   Default Text
    </div>
  </div>
  </div>

  <!-- No script needed for pure visual clone -->
</body>
</html>
