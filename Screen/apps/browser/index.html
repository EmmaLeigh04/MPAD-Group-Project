<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-toolbar">
    <div class="browser-menu-row">
      <span class="browser-menu-item">File</span>
      <span class="browser-menu-item">Edit</span>
      <span class="browser-menu-item">View</span>
      <span class="browser-menu-item">Favourites</span>
      <span class="browser-menu-item">Tools</span>
      <span class="browser-menu-item">Help</span>
    </div>
    <div class="browser-icon-row">
      <img src="../../../icons/windowsIcons/back.png" alt="Back" class="browser-toolbar-icon">
      <img src="../../../icons/windowsIcons/forward.png" alt="Forward" class="browser-toolbar-icon">
      <img src="../../../icons/windowsIcons/stop.png" alt="Stop" class="browser-toolbar-icon">
      <img src="../../../icons/windowsIcons/refresh.png" alt="Refresh" class="browser-toolbar-icon">
      <img src="../../../icons/windowsIcons/home.png" alt="Home" class="browser-toolbar-icon">
      <img src="../../../icons/windowsIcons/zoomin.png" alt="Zoom In" class="browser-toolbar-icon"><span style="margin-right:10px; font-size:14px; color:#222;">Search</span>
      <img src="../../../icons/windowsIcons/favourites.png" alt="Favourites" class="browser-toolbar-icon"><span style="margin-right:10px; font-size:14px; color:#222;">Favourites</span>
      <img src="../../../icons/windowsIcons/mail.png" alt="Mail" class="browser-toolbar-icon">
    </div>
    <div class="browser-address-row">
      <label for="browser-address" class="browser-address-label">Address</label>
      <input id="browser-address" class="browser-address-input" type="text" value="https://www.google.com" />
      <img src="../../../icons/windowsIcons/searchgo.png" alt="Go" class="browser-address-icon">
    </div>
  </div>
  <div class="google-logo">
    <img src="../../../images/google-logo.png" alt="Google logo" style="width:350px;max-width:90vw;">
  </div>
  <div class="links">
    <b>Web</b>
    <a href="#">Images</a>
    <a href="#">Groups</a>
    <a href="#">News</a>
    <a href="#">Froogle</a>
    <a href="#">Local</a>
    <a href="#">more »</a>
    <span class="right-links">
      <a href="#">Advanced Search</a> |
      <a href="#">Preferences</a> |
      <a href="#">Language Tools</a>
    </span>
  </div>
  <form class="search-bar" onsubmit="return false;">
    <div class="input-wrapper">
      <input id="search-input" type="text" name="q" autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox">
      <div id="suggestion-list">
        <div id="myspace-suggestion">
          https://www.myspace.com
        </div>
      </div>
    </div>
    <div>
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>
  </form>
  <script>
    // Show MySpace suggestion as a dropdown below the search bar
    const searchInput = document.getElementById('search-input');
    const suggestionList = document.getElementById('suggestion-list');
    const myspaceSuggestion = document.getElementById('myspace-suggestion');
    const myspaceUrl = 'https://www.myspace.com';
    if (searchInput && suggestionList && myspaceSuggestion) {
      function showSuggestion() {
        suggestionList.style.display = 'block';
      }
      function hideSuggestion() {
        // Delay hiding to allow click
        setTimeout(() => { suggestionList.style.display = 'none'; }, 120);
      }
      searchInput.addEventListener('focus', showSuggestion);
      searchInput.addEventListener('input', showSuggestion);
      searchInput.addEventListener('blur', hideSuggestion);
      myspaceSuggestion.addEventListener('mousedown', function(e) {
        e.preventDefault();
        searchInput.value = myspaceUrl;
        suggestionList.style.display = 'none';
      });
    }

    // Navigate to MySpace page when Google Search is clicked with myspace URL
    document.querySelector('.search-bar').addEventListener('submit', function(e) {
      e.preventDefault();
    });
    var searchBtn = document.querySelectorAll('.search-bar button')[0];
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        if (searchInput.value.trim().toLowerCase().includes('myspace')) {
          window.location.href = 'myspace.html';
        }
      });
    }
  </script>
  <div class="footer">
    <a href="#">Advertising Programs</a> - <a href="#">About Google</a>
    <div class="copyright">
      ©2005 Google - Searching 8,058,044,651 web pages
    </div>
  </div>
</body>
</html>
