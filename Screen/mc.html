<!doctype html> 
<html lang="eng"> 
  <head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monica's Computer</title>
  <link rel="stylesheet" href="mc.css">

  </head>

  <body> 
      <audio id="error-audio" src="../sounds/error3.mp3"></audio>
     <div id="error-modal-1" class="error-modal" style="top:50%; left:50%; transform:translate(-50%, -50%);">
      <div class="error-window">
        <button class="error-x" aria-label="Close">&#10006;</button>
        <div class="error-title">Error</div>
        <div class="error-message">Update failed, please try again later.</div>
        <button class="error-close">OK</button>
      </div>
    </div>
    </div>
    <div id="error-modal-3" class="error-modal" style="top:50%; left:50%; transform:translate(calc(-50% + 60px), calc(-50% + 60px)); display:none;">
      <div class="error-window">
        <button class="error-x" aria-label="Close">&#10006;</button>
        <div class="error-title">Error</div>
        <div class="error-message">Keyboard not responding.</div>
        <button class="error-close">OK</button>
      </div>
    </div>
    <div id="desktop">
    <div class="icons">
      
      <div class="icon" data-app="browser" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="icon-img" aria-hidden="true" data-name="browser"><img src="../icons/windowsIcons/ie.png" alt="Internet Explorer"></div>
        <span><u>I</u>nternet Explorer</span>
      </div>

      <div class="icon" data-app="mail" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="icon-img" aria-hidden="true" data-name="mail"><img src="../icons/windowsIcons/mail2.png" alt="Mail"></div>
        <span><u>M</u>ail</span>
      </div>

      <div class="icon" data-app="notepad" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="icon-img" aria-hidden="true" data-name="notepad"><img src="../icons/windowsIcons/notepad2.png" alt="Notepad"></div>
        <span><u>N</u>otepad</span>
      </div>

      <div class="icon" data-app="documents" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="icon-img" aria-hidden="true" data-name="Documents"><img src="../icons/windowsIcons/documents.png" alt="Documents"></div>
        <span><u>D</u>ocuments</span>
      </div>

    <div class="icon" data-app="Recycling Bin" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">
        <div class="icon-img" aria-hidden="true" data-name="recycling-bin"><img src="../icons/windowsIcons/recycling.png" alt="Recycling Bin"></div>
        <span><u>R</u>ecycling Bin</span>
      </div>
    </div>

    <div id="windows"></div>

    <div id="taskbar">
      <button id="start-btn" style="background: none; border: none; padding: 0; margin: 0; cursor: pointer; height: 40px; width: 120px; display: flex; align-items: center; justify-content: flex-start; position: absolute; left: 0;">
        <img src="../icons/windowsIcons/start.png" alt="Start" style="height: 38px; width: 116px; display: block;" />
      </button>
      <div class="quick-launch" aria-hidden="true">
      <button class="ql-btn" title="Show Desktop"><img src="images/ql-desktop.png" alt=""></button>
      <button class="ql-btn" title="Browser"><img src="images/browser.png" alt=""></button>
    </div>

    <div id="task-list"></div>

    <div id="tray">
      <div class="tray-icons" aria-hidden="true">
        <img src="../icons/windowsIcons/virus.png" alt="Virus" style="height: 22px; width: 22px; margin-left: 8px;" />
        <img src="../icons/windowsIcons/volume.png" alt="Volume" style="height: 22px; width: 22px; margin-left: 8px;" />
      </div>
      <div id="clock">3:00 PM 13/3/2005</div>
    </div>
  </div>

  <!-- Window template used for app popups -->
  <template id="template-window">
    <div class="win-frame error-window" role="dialog">
      <div class="titlebar win-titlebar" style="border-bottom:2px solid #000080; display:flex; align-items:center; height:32px; position:relative; padding:0 8px 0 6px;">
        <img src="../icons/windowsIcons/notepad2.png" alt="Notepad icon" class="np2-titlebar-icon notepad-icon" style="height:20px;width:20px;margin-right:8px;display:none;">
        <img src="../icons/windowsIcons/ie.png" alt="IE icon" class="np2-titlebar-icon ie-icon" style="height:20px;width:20px;margin-right:8px;display:none;">
        <div class="title" style="font-size:15px;font-weight:bold;flex:1;user-select:none;"></div>
        <button class="error-x close" aria-label="Close">&#10006;</button>
      </div>
      <div class="contents"></div>
      </div>
    </div>
  </template>

  <template id="template-icon-popup">
    <div class="icon-popup" role="menu" aria-hidden="true">
      <button role="menuitem" data-action="open">Open</button>
      <button role="menuitem" data-action="preview">Preview</button>
      <button role="menuitem" data-action="properties">Properties</button>
    </div>
  </template>

  <script src="fun.js" defer></script>
  <script src="mc.js" defer></script>
</body>
</html>
