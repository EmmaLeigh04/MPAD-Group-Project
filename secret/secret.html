<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Untitled - Notepad2</title>
  <link rel="stylesheet" href="secret.css">
</head>
<body>
  <div class="np2-window" id="secret-app-root">
    <div id="secret-login-modal" style="position:absolute;top:0;left:0;width:100vw;height:100vh;background:rgba(236,233,216,0.98);z-index:10;display:flex;align-items:center;justify-content:center;">
      <div style="background:#fffbe7;border:2px solid #b5b5b5;padding:32px 40px;border-radius:8px;box-shadow:0 2px 16px #0002;display:flex;flex-direction:column;align-items:center;">
        <h2 style="margin-bottom:18px;">MySpace Login</h2>
        <div style="margin-bottom:12px;width:100%;"><label for="secret-username">Username:</label><input id="secret-username" type="text" style="margin-left:8px;"></div>
        <div style="margin-bottom:18px;width:100%;"><label for="secret-password">Password:</label><input id="secret-password" type="password" style="margin-left:8px;"></div>
        <button id="secret-login-btn" style="padding:6px 18px;font-size:15px;">Continue</button>
        <div id="secret-login-error" style="color:#b00;margin-top:12px;display:none;">Incorrect username or password.</div>
      </div>
    </div>
    <div id="secret-notepad-ui">
      <div class="np2-menu">
        <span class="np2-menu-item">File</span>
        <span class="np2-menu-item">Edit</span>
        <span class="np2-menu-item">View</span>
        <span class="np2-menu-item">Settings</span>
        <span class="np2-menu-item">?</span>
      </div>
      <div class="np2-toolbar">
        <span class="np2-toolbar-btn" title="New">
          <img src="../../../icons/windowsIcons/newnote.png" alt="New" style="height:20px;width:20px;vertical-align:middle;">
        </span>
        <span class="np2-toolbar-btn" title="Open">
          <img src="../../../icons/windowsIcons/open.png" alt="Open" style="height:20px;width:20px;vertical-align:middle;">
        </span>
        <span class="np2-toolbar-btn" title="Save">
          <img src="../../../icons/windowsIcons/save.png" alt="Save" style="height:20px;width:20px;vertical-align:middle;">
        </span>
      </div>
      <textarea class="np2-editor" spellcheck="false"> msu : YouKnowYouHateMe 
      msp: 12345 
      </textarea>
      <div class="np2-statusbar">
        Ln 1 : 1   Col 1   Sel 0   0 Bytes   ANSI   CR+LF   INS   Default Text
      </div>
    </div>
    <div id="secret-browser-ui" style="display:none;height:100%;width:100%;flex-direction:column;">
      <div class="browser-toolbar">
        <div class="browser-menu-row">
          <span class="browser-menu-item">File</span>
          <span class="browser-menu-item">Edit</span>
          <span class="browser-menu-item">View</span>
          <span class="browser-menu-item">Favourites</span>
          <span class="browser-menu-item">Tools</span>
          <span class="browser-menu-item">Help</span>
        </div>
        <div class="browser-icon-row">
          <img src="../../../icons/windowsIcons/back.png" alt="Back" class="browser-toolbar-icon">
          <img src="../../../icons/windowsIcons/forward.png" alt="Forward" class="browser-toolbar-icon">
          <img src="../../../icons/windowsIcons/stop.png" alt="Stop" class="browser-toolbar-icon">
          <img src="../../../icons/windowsIcons/refresh.png" alt="Refresh" class="browser-toolbar-icon">
          <img src="../../../icons/windowsIcons/home.png" alt="Home" class="browser-toolbar-icon">
          <img src="../../../icons/windowsIcons/zoomin.png" alt="Zoom In" class="browser-toolbar-icon"><span style="margin-right:10px; font-size:14px; color:#222;">Search</span>
          <img src="../../../icons/windowsIcons/favourites.png" alt="Favourites" class="browser-toolbar-icon"><span style="margin-right:10px; font-size:14px; color:#222;">Favourites</span>
          <img src="../../../icons/windowsIcons/mail.png" alt="Mail" class="browser-toolbar-icon">
        </div>
        <div class="browser-address-row">
          <label for="browser-address" class="browser-address-label">Address</label>
          <input id="browser-address" class="browser-address-input" type="text" value="https://www.myspace.com" />
          <img src="../../../icons/windowsIcons/searchgo.png" alt="Go" class="browser-address-icon">
        </div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff;">
        <img src="../images/myspace.JPG" alt="MySpace" style="max-width:98vw;max-height:80vh;box-shadow:0 2px 16px #0002;border:2px solid #b5b5b5;">
      </div>
    </div>
  </div>
<script>
// Secret login logic
document.addEventListener('DOMContentLoaded', function() {
  var loginBtn = document.getElementById('secret-login-btn');
  var loginModal = document.getElementById('secret-login-modal');
  var notepadUI = document.getElementById('secret-notepad-ui');
  var browserUI = document.getElementById('secret-browser-ui');
  var errorMsg = document.getElementById('secret-login-error');
  loginBtn.addEventListener('click', function() {
    var user = document.getElementById('secret-username').value.trim();
    var pass = document.getElementById('secret-password').value.trim();
    if (user === 'YouKnowYouHateMe' && pass === '12345') {
      loginModal.style.display = 'none';
      notepadUI.style.display = 'none';
      browserUI.style.display = 'flex';
    } else {
      errorMsg.style.display = 'block';
    }
  });
});
</script>
</body>
</html>
