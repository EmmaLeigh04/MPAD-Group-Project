<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Windows XP</title>
  <link rel="stylesheet" href="xp-login.css">
</head>
<body>
  <div class="xp-login-bg">
    <div class="xp-login-main">
      <div class="xp-login-left">
        <img class="xp-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Windows_XP_logo.svg" alt="Windows XP Logo" height="54">
        <div class="xp-welcome">Microsoft <b>Windows<sup style='font-size:13px;vertical-align:2px;'>XP</sup></b></div>
        <div class="xp-instruct">To begin, click your user name</div>
      </div>
      <div class="xp-login-right">
        <div class="xp-user">
          <img class="xp-user-pic" src="https://static.wikia.nocookie.net/windows/images/7/7c/Windows_XP_User_Account_Picture.png" alt="User" width="64" height="64">
          <div class="xp-user-name">Alan</div>
        </div>
      </div>
    </div>
    <div class="xp-login-bottom">
      <div class="xp-shutdown">
        <span class="xp-shutdown-icon">&#x23FB;</span> Turn off computer
      </div>
      <div class="xp-help">After you log on, you can add or change accounts.<br>Just go to Control Panel and click User Accounts.</div>
    </div>
  </div>
</body>
</html>
